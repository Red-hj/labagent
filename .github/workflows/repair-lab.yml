name: Run FRR repair comparison

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Choose the reproducible experiment
        type: choice
        default: frr_three_routers
        options:
          - frr_three_routers
          - frr_renamed

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run actual OSPF processes and independent repair candidates
        env:
          LABAGENT_ACTION_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABAGENT_EXPERIMENT: ${{ inputs.experiment }}
        run: sudo --preserve-env=LABAGENT_ACTION_URL python3 -B scripts/run_repair_lab.py --case "data/lab/${LABAGENT_EXPERIMENT}.json"
      - name: Check reference experiment outcomes
        run: |
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          from labagent.repair_lab import compare_run
          result = compare_run(json.loads(Path('runtime/repair-lab/run.json').read_text()))
          assert [phase['passed_count'] for phase in result['phases']] == [1, 1, 3], result
          assert result['recommended'] == 'ospf'
          PY
      - name: Upload raw commands and observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frr-repair-comparison-${{ github.sha }}
          path: runtime/repair-lab/
          retention-days: 14
          if-no-files-found: error
